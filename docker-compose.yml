services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    volumes:
      - ledger_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: ./server
    environment:
      DATABASE_URL: postgresql://postgres:devpass@postgres:5432/ledger?schema=public
      JWT_SECRET: dev-only-change-me
      PORT: 4000
      LOG_LEVEL: info
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ledger_pg_data: